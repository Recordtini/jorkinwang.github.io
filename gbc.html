<script>
const jsonUrl = "outputs/gamespot_gbc_reviews.json";
const listBody = document.getElementById("list-body");
const loadState = document.getElementById("load-state");
const sortButtons = Array.from(document.querySelectorAll(".sortbtn"));
const filterInput = document.getElementById("filter-input");
const filterCount = document.getElementById("filter-count");
let loadedGames = [];
let activeSort = "score";
let filterText = "";

function text(value) {
  return value == null || value === "" ? "\u00a0" : String(value);
}

function oneDecimal(value) {
  return value == null || value === "" ? "\u00a0" : Number(value).toFixed(1);
}

function wholeScore(value) {
  return value == null || value === "" ? "\u00a0" : String(value);
}

function escapeHtml(value) {
  return text(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function gameHref(game) {
  return game.final_wayback_url || game.requested_wayback_url || game.original_url || "#";
}

function sortDate(game) {
  const raw = game.release_date || "";
  const parts = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (parts) {
    return `${parts[3]}-${parts[1].padStart(2, "0")}-${parts[2].padStart(2, "0")}`;
  }
  const year = raw.match(/^\d{4}$/);
  return year ? `${raw}-00-00` : raw;
}

function sortValue(game, key) {
  if (key === "date") return sortDate(game);
  if (key === "genre") return text(game.genre).toLowerCase();
  if (key === "title") return text(game.title).toLowerCase();
  if (key === "publisher") return text(game.publisher).toLowerCase();
  if (key === "score") return game.score && game.score.gamespot != null ? Number(game.score.gamespot) : -1;
  const components = (game.score && game.score.components) || {};
  if (key === "gameplay") return components.gameplay != null ? Number(components.gameplay) : -1;
  if (key === "graphics") return components.graphics != null ? Number(components.graphics) : -1;
  if (key === "sound") return components.sound != null ? Number(components.sound) : -1;
  if (key === "value") return components.value != null ? Number(components.value) : -1;
  if (key === "tilt") return components.reviewers_tilt != null ? Number(components.reviewers_tilt) : -1;
  if (key === "reviewer") return text(game.review && game.review.reviewer).toLowerCase();
  return "";
}

function matchesFilter(game) {
  if (!filterText) return true;
  const haystack = [
    game.title, game.genre, game.publisher, game.developer,
    game.review && game.review.reviewer, game.review && game.review.blurb,
  ].filter(Boolean).join(" ").toLowerCase();
  return filterText.split(/\s+/).every((word) => haystack.includes(word));
}

function visibleGames() {
  const filtered = loadedGames.filter(matchesFilter);
  return filtered.sort((a, b) => {
    const av = sortValue(a, activeSort);
    const bv = sortValue(b, activeSort);
    if (typeof av === "number" || typeof bv === "number") {
      const diff = Number(bv) - Number(av);
      if (diff !== 0) return diff;
    } else {
      const descending = activeSort === "date";
      const diff = descending ? String(bv).localeCompare(String(av)) : String(av).localeCompare(String(bv));
      if (diff !== 0) return diff;
    }
    return text(a.title).localeCompare(text(b.title));
  });
}

function renderAll() {
  listBody.innerHTML = "";
  const games = visibleGames();
  games.forEach((game, i) => renderGame(game, i + 1));
  filterCount.textContent = filterText ? `showing ${games.length} of ${loadedGames.length}` : "";
}

function renderGame(game, rank) {
  const components = (game.score && game.score.components) || {};
  const href = escapeHtml(gameHref(game));
  const meta = [game.publisher, game.genre, game.release_date].filter(Boolean).map(escapeHtml).join(" &middot; ");
  const tr = document.createElement("tr");
  tr.setAttribute("valign", "top");
  tr.innerHTML = `
    <td width="30" align="center" valign="top"><span class="gsgrey11"><b>${String(rank).padStart(2, "0")}</b></span></td>
    <td width="306" valign="top">
      <a href="${href}" class="gsyellow13">${escapeHtml(game.title)}</a><br>
      <span class="gsgrey11">${meta}</span><br>
      <span class="blurb gsgrey10">${escapeHtml(game.review && game.review.blurb)}</span>
      <a href="${href}" class="gslink11">Read More</a>
    </td>
    <td width="60" align="center"><span class="gsgrey11"><b>score:</b></span><br><span class="gsscore3">${oneDecimal(game.score && game.score.gamespot)}</span></td>
    <td width="50" align="center"><span class="gsscore3">${wholeScore(components.gameplay)}</span></td>
    <td width="50" align="center"><span class="gsscore3">${wholeScore(components.graphics)}</span></td>
    <td width="50" align="center"><span class="gsscore3">${wholeScore(components.sound)}</span></td>
    <td width="50" align="center"><span class="gsscore3">${wholeScore(components.value)}</span></td>
    <td width="100" valign="top"><span class="gsgrey11">${escapeHtml(game.review && game.review.reviewer)}</span></td>`;
  listBody.appendChild(tr);
  const div = document.createElement("tr");
  div.innerHTML = `<td width="746" colspan="8"><img src="/web/20011107142422im_/http://gamespot.com/gamespot/shared4/dot_333333.gif" width="746" height="1" hspace="0" vspace="6"></td>`;
  listBody.appendChild(div);
}

sortButtons.forEach((button) => {
  button.addEventListener("click", () => {
    activeSort = button.dataset.sort;
    sortButtons.forEach((candidate) => candidate.classList.toggle("active", candidate === button));
    renderAll();
  });
});

filterInput.addEventListener("input", () => {
  filterText = filterInput.value.trim().toLowerCase();
  renderAll();
});

fetch(jsonUrl)
  .then((response) => {
    if (!response.ok) throw new Error(response.statusText);
    return response.json();
  })
  .then((data) => {
    loadedGames = data.games || [];
    renderAll();
    loadState.style.display = "none";
  })
  .catch(() => {
    loadState.textContent = "Could not load review data.";
  });
</script>
