<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Price Is Right 2010</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  #shud{position:fixed;left:8px;top:8px;z-index:20;background:#000a;border-radius:8px;padding:6px 12px;font:600 14px system-ui;display:none}
  #shud button{margin-left:10px;font:600 12px system-ui;padding:3px 10px;border-radius:6px;border:0;background:#e8c23a;cursor:pointer}
  #ov{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(#243a78,#0a1030 70%);background-size:cover;background-position:center;padding:20px;overflow:auto}
  #ov.clear{background:#000a}
  #ov h1{font-size:clamp(26px,5.5vw,56px);margin:0 0 8px;text-shadow:0 3px 10px #000}
  #ov p{max-width:680px;opacity:.92;margin:6px 0;line-height:1.35}
  #ov .small,#ov small{font-size:12px;opacity:.7}
  .col{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(340px,86vw);margin-top:12px}
  .col button,.game{font:700 20px system-ui;padding:12px 28px;border-radius:12px;border:0;background:#e8c23a;color:#111;cursor:pointer}
  .col button:hover,.game:hover:not(:disabled){filter:brightness(1.12)}
  .col button:disabled,.game:disabled{background:#3a4468;color:#99a;cursor:default}
  .col button small{display:block;font:400 11px system-ui}
  .col input[type=text],.col input:not([type]){font:600 20px system-ui;padding:10px;border-radius:10px;border:0;text-align:center}
  .col label{display:flex;justify-content:space-between;gap:16px;align-items:center;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;max-width:900px;width:100%;margin:10px 0}
  .game{font-size:15px;padding:12px 8px}.game small{display:block;font:400 11px system-ui;margin-top:3px}
  .list{max-width:720px;width:100%;max-height:62vh;overflow:auto;background:#0007;border-radius:12px;padding:8px 14px;margin-top:6px}
  .row{display:flex;justify-content:space-between;gap:18px;padding:6px 0;border-bottom:1px solid #fff2;text-align:left}.row.done{color:#9f9}.row span{opacity:.85;max-width:60%}
  .who{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 10px;font-size:16px}
  .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;border:2px solid #fff8}
  .avrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.avc{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.avc.sel{border-color:#fff}
  #scap{position:fixed;left:0;right:0;bottom:0;z-index:25;text-align:center;font:600 18px system-ui;text-shadow:0 2px 4px #000;padding:8px;pointer-events:none}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:50;text-align:center;padding:24px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:#e8c23a;color:#111;font:700 16px system-ui;padding:10px 20px;border-radius:10px;box-shadow:0 4px 18px #000a}
</style></head>
<body>
<div id="stage"></div><div id="shud"></div><div id="scap"></div>
<div id="ov" role="status"><p>Loading…</p></div>
<div id="err"></div>
<script type="module" src="show.js?v=10"></script>
</body></html>
