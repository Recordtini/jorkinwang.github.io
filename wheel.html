<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Fortune 2nd Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #0a0a12; overflow: hidden; }
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: Verdana, Arial, sans-serif; }
        #stage {
            position: relative;
            width: min(100vw, calc(100vh * 4 / 3));
            height: min(100vh, calc(100vw * 3 / 4));
        }
        canvas#game {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: auto;
            background: #000;
            border: 1px solid #1a1a2e;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
        }
        #loading {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #7fd8ff; z-index: 10; text-align: center; gap: 12px;
            background: radial-gradient(ellipse at center, #101030 0%, #05050a 70%);
        }
        #loading .barwrap { width: 60%; height: 22px; border: 1px solid #2a4a6a; border-radius: 4px; background: #0a0a18; overflow: hidden; }
        #loading .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00c8ff, #7f4cff); transition: width 0.2s; }
        #loading h1 { font-size: 3.2vh; letter-spacing: 0.3em; color: #ffd700; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        #loading p { font-size: 1.6vh; color: #6fb3d9; }
        #loading button {
            display: none; margin-top: 8px; padding: 14px 40px; font-size: 18px; cursor: pointer;
            background: linear-gradient(180deg, #ffe066, #f5a623); border: none; border-radius: 12px;
            color: #3a2a00; font-weight: bold; letter-spacing: 0.1em; box-shadow: 0 4px 20px rgba(245, 166, 35, 0.5);
        }
        #loading button:hover { filter: brightness(1.1); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="stage">
        <canvas id="game" width="800" height="600"></canvas>
        <div id="loading">
            <h1>WHEEL OF FORTUNE</h1>
            <p>2nd Edition</p>
            <div class="barwrap"><div class="bar" id="loadbar"></div></div>
            <p id="loadmsg">Loading assets...</p>
            <button id="startbtn"></button>
        </div>
    </div>
    <script src="js/assets.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
