# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==12.3.0
      - name: Test build and game rules
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          node --test jeopardy/game.test.mjs wheel/tests/*.test.js
      - name: Cache encoded images
        uses: actions/cache@v4
        with:
          path: .pages-cache
          key: pages-webp-q85-v1-${{ hashFiles('tools/build_pages.py', 'wheel/assets/**', 'jeopardy/assets/**') }}
          restore-keys: pages-webp-q85-v1-
      - name: Build compressed site
        run: python tools/build_pages.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Originals remain in Git; only optimized runtime copies are published.
          path: '.pages-dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
