    <style>
        @font-face {
            font-family: "Comic Sans Local";
            src: url("comic-sans.woff") format("woff");
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #393939; /* Gray background */
            display: flex;
            justify-content: center;
            align-items: center;

        }

        a, summary {

            color: #1A1A1A; /* Light gray text */
            font-size: 3vw; /* Scales with screen size */
            text-decoration: none;
            text-transform: lowercase; /* Forces all lower case */
            transition: color 0.2s;
        }

        summary {
            cursor: pointer;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        .pages {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0 16px;
        }

        a:hover, a:focus-visible, summary:hover, summary:focus-visible {
            color: #ffffff; /* Brightens when you hover over it */
        }

        /* Fallback for very small screens */
        @media (max-width: 600px) {
            a, summary {
                font-size: 24px;
            }
        }
    </style>
</head>
