<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Car</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0e; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#stage { background: #000; image-rendering: auto; max-width: 100vw; max-height: 100vh; }
  #status { position: fixed; left: 12px; bottom: 10px; font-size: 12px; opacity: .8; pointer-events: none; white-space: pre; }
  #cheat { position: fixed; right: 12px; top: 48px; width: 300px; max-height: calc(100vh - 64px); overflow: auto; background: rgba(15,15,22,.94); border: 1px solid #445; border-radius: 8px; padding: 10px 14px 14px; display: none; z-index: 5; }
  #cheat h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8ab; }
  #cheat .note { font-size: 11px; opacity: .65; margin: 0 0 6px; }
  #cheat .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  #gear { position: fixed; right: 12px; top: 12px; z-index: 6; width: 30px; height: 30px; border-radius: 6px; border: 1px solid #556; background: rgba(15,15,22,.6); color: #ccd; font-size: 18px; line-height: 1; cursor: pointer; opacity: .35; transition: opacity .2s; }
  #gear:hover, #gear:focus-visible { opacity: 1; }
  #cheat h3 { margin: 0 0 8px; font-size: 14px; }
  #cheat label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; gap: 8px; }
  #cheat button, #cheat select { background: #22263a; color: #eee; border: 1px solid #556; border-radius: 4px; padding: 3px 8px; }
  #cheat hr { border: 0; border-top: 1px solid #334; margin: 8px 0; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #0b0b0e; }
</style>
</head>
<body>
<div id="wrap"><canvas id="stage" width="640" height="480"></canvas></div>
<div id="status">Loading…</div>
<button id="gear" title="Options and cheats (F1)" aria-label="Options and cheats">⚙</button>
<div id="cheat"></div>
<div id="err"></div>
<script type="module" src="main.js"></script>
</body>
</html>
