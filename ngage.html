<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Gage Trash Can</title>
<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#000000;
  overflow-x:hidden;
  font-family:"Comic Sans MS","Comic Sans",cursive;
  color:#dddddd;
}
*{box-sizing:border-box;}
body{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.scene{
  width:min(940px,100vw);
  aspect-ratio:900/980;
  position:relative;
  margin:10px auto 20px;
}
svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}
.can-scroll{
  position:absolute;
  left:24.3%;
  top:20.2%;
  width:51.4%;
  height:65.3%;
  overflow:auto;
  background:#404040;
  border:4px solid #9a9a9a;
  border-radius:16px 16px 40px 40px;
  padding:8px;
  scrollbar-color:#8d8d8d #4b4b4b;
  scrollbar-width:auto;
}
.can-scroll::-webkit-scrollbar{width:14px;}
.can-scroll::-webkit-scrollbar-track{background:#4b4b4b;}
.can-scroll::-webkit-scrollbar-thumb{background:#8d8d8d;border:2px solid #4b4b4b;}
.list{display:block;}
.card{
  background:#cfcfcf;
  color:#000000;
  border:3px solid #666666;
  margin:0 0 8px;
  padding:6px;
  font-size:13px;
  line-height:1.18;
}
.title-row{
  display:flex;
  gap:8px;
  align-items:flex-start;
  justify-content:space-between;
}
.title{
  font-size:20px;
  line-height:1.02;
  font-weight:bold;
  color:#000000;
  text-decoration:none;
}
.title:hover{text-decoration:underline;}
.score{
  flex:0 0 auto;
  background:#999999;
  border:2px solid #555555;
  padding:3px 6px;
  font-size:24px;
  font-weight:bold;
  line-height:1;
}
.meta{
  margin-top:4px;
  font-size:12px;
}
.blurb{
  margin-top:6px;
  font-size:13px;
}
.stats{
  margin-top:6px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}
.stat{
  background:#b6b6b6;
  border:2px solid #6b6b6b;
  padding:2px 5px;
  font-size:11px;
  font-weight:bold;
}
.loading,.error{
  background:#cfcfcf;
  color:#000000;
  border:3px solid #666666;
  padding:10px;
  font-size:14px;
}
@media (max-width:700px){
  .scene{width:100vw; aspect-ratio:auto; height:1180px;}
  .can-scroll{left:18%; width:64%; top:19%; height:66%;}
  .title{font-size:17px;}
  .score{font-size:20px;}
}
</style>
</head>
<body>
<div class="scene">
  <svg viewBox="0 0 900 980" aria-hidden="true">
    <g transform="translate(0,8)">
      <ellipse cx="450" cy="940" rx="200" ry="16" fill="#1a1a1a"/>
      <ellipse cx="450" cy="125" rx="245" ry="34" fill="#595959" stroke="#a8a8a8" stroke-width="8"/>
      <ellipse cx="450" cy="127" rx="220" ry="23" fill="#202020"/>
      <path d="M205 125 L695 125 L625 865 Q620 910 575 910 L325 910 Q280 910 275 865 Z"
            fill="#7b7b7b" stroke="#5f5f5f" stroke-width="8"/>
      <path d="M222 150 L678 150 L615 846 Q610 882 572 882 L328 882 Q290 882 285 846 Z"
            fill="#8a8a8a"/>
      <line x1="312" y1="164" x2="290" y2="855" stroke="#6b6b6b" stroke-width="7"/>
      <line x1="388" y1="156" x2="375" y2="865" stroke="#6b6b6b" stroke-width="7"/>
      <line x1="450" y1="154" x2="450" y2="868" stroke="#6b6b6b" stroke-width="7"/>
      <line x1="512" y1="156" x2="525" y2="865" stroke="#6b6b6b" stroke-width="7"/>
      <line x1="588" y1="164" x2="610" y2="855" stroke="#6b6b6b" stroke-width="7"/>
    </g>
  </svg>

  <div class="can-scroll">
    <div id="list" class="list">
      <div class="loading">LOADING TRASH...</div>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'outputs/gamespot_ngage_reviews.json';
const list = document.getElementById('list');

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function scoreText(v){return typeof v === 'number' ? v.toFixed(1) : '-';}
function tiny(v){return typeof v === 'number' ? v : '-';}
function sortGames(games){
  return games.slice().sort(function(a,b){
    const av = typeof a.score === 'number' ? a.score : -999;
    const bv = typeof b.score === 'number' ? b.score : -999;
    if (bv !== av) return bv - av;
    return String(a.title||'').localeCompare(String(b.title||''));
  });
}
function render(games){
  const sorted = sortGames(games);
  list.innerHTML = sorted.map(function(g){
    return '<div class="card">'
      + '<div class="title-row">'
      + '<div>'
      + '<a class="title" href="'+esc(g.href||'#')+'">'+esc(g.title||'Untitled')+'</a>'
      + '<div class="meta">'+esc(g.publisher||'')
      + (g.genre ? ' / '+esc(g.genre) : '')
      + (g.date ? ' / '+esc(g.date) : '')
      + (g.reviewer ? ' / '+esc(g.reviewer) : '')
      + '</div>'
      + '</div>'
      + '<div class="score">'+scoreText(g.score)+'</div>'
      + '</div>'
      + '<div class="blurb">'+esc(g.blurb||'')+'</div>'
      + '<div class="stats">'
      + '<span class="stat">PLAY '+tiny(g.gameplay)+'</span>'
      + '<span class="stat">GRAPH '+tiny(g.graphics)+'</span>'
      + '<span class="stat">SOUND '+tiny(g.sound)+'</span>'
      + '<span class="stat">VALUE '+tiny(g.value)+'</span>'
      + '<span class="stat">TILT '+tiny(g.tilt)+'</span>'
      + '</div>'
      + '</div>';
  }).join('');
}

fetch(DATA_URL,{cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    const games = Array.isArray(data) ? data : (data && Array.isArray(data.games) ? data.games : null);
    if(!games) throw new Error('Unexpected JSON shape');
    render(games);
  })
  .catch(function(err){
    console.error(err);
    list.innerHTML = '<div class="error">COULD NOT LOAD THE TRASH.</div>';
  });
</script>
</body>
</html>
